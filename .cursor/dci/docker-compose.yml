# DCI vector store — PostgreSQL 16 + pgvector
# Embeddings: local Python server (.cursor/tools/dci/lib/dci_embed_server.py on :18081), started by dci-vector.sh up
services:
  dci-pgvector:
    image: pgvector/pgvector:pg16
    container_name: gp_dq_dci_pgvector
    environment:
      POSTGRES_DB: dci_vectors
      POSTGRES_USER: dci
      POSTGRES_PASSWORD: dci_local
    ports:
      - "5433:5432"
    volumes:
      - dci_pgvector_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dci -d dci_vectors"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dci_pgvector_data:
