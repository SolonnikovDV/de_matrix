# Настройки приложения: только пути. Мета (шаблоны, литература, стек) — в едином источнике (matrix.json).

# Каталог с файлами-источниками (один файл = структура + вся мета). JSON, YAML, Excel.
source_dir: data/sources

# Чекпоинт: сохранённое состояние (дерево + матрица + мета). Сверка с источником по хешу.
checkpoint_file: data/checkpoint.yaml

# Файл по умолчанию в source_dir (единый источник: структура и мета в одном файле).
default_source: matrix.json

# Каталог для скачанной литературы
literature_dir: data/library

# SSL при скачивании литературы. При ошибке верификации сертификата на рабочей машине:
# ssl_verify: false  # отключить проверку (или DE_MATRIX_SSL_VERIFY=0)
ssl_verify: false

# Автоскейл: уровни и разделы по структуре источника (любая глубина дочерних).
flexible: true

# Режим хранения: file | db
storage_mode: db

# Любая догрузка создаёт запрос на изменение и требует апрува перед применением.
approval_required: true
