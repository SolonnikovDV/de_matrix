services:
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: de-matrix-proxy
    env_file:
      - .env
    ports:
      - "${DE_MATRIX_PROXY_HTTP_PORT:-80}:80"
      - "${DE_MATRIX_PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/certs/live:/etc/nginx/certs:ro
      - proxy_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/proxy-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - edge

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: de-matrix-app
    env_file:
      - .env
    environment:
      DE_MATRIX_DB_URL: ${DE_MATRIX_DB_URL_RUNTIME:-postgresql+psycopg://dematrix:dematrix@postgres:5432/dematrix}
      DE_MATRIX_MONGO_URI: ${DE_MATRIX_MONGO_URI:-mongodb://mongo:27017}
      DE_MATRIX_MONGO_DB: ${DE_MATRIX_MONGO_DB:-de_matrix}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      smtp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:5001/api/schema', timeout=3); sys.exit(0)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - edge
      - backend

  postgres:
    image: postgres:16
    container_name: de-matrix-postgres
    environment:
      POSTGRES_DB: dematrix
      POSTGRES_USER: dematrix
      POSTGRES_PASSWORD: dematrix
    ports:
      - "127.0.0.1:${DE_MATRIX_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dematrix -d dematrix"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  mongo:
    image: mongo:7
    container_name: de-matrix-mongo
    ports:
      - "127.0.0.1:${DE_MATRIX_MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping').ok\" --quiet"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  smtp:
    image: axllent/mailpit:latest
    container_name: de-matrix-smtp
    ports:
      - "127.0.0.1:${DE_MATRIX_MAIL_UI_PORT:-18025}:8025"
      - "127.0.0.1:${DE_MATRIX_MAIL_SMTP_PORT:-11025}:1025"
    restart: unless-stopped
    networks:
      - edge

volumes:
  postgres_data:
  mongo_data:
  proxy_logs:

networks:
  edge:
  backend:
    internal: true
