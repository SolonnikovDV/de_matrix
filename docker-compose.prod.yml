services:
  proxy:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  app:
    volumes: []
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    pids_limit: 512
    ulimits:
      nproc: 2048
      nofile:
        soft: 65535
        hard: 65535

  postgres:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    pids_limit: 1024

  mongo:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    pids_limit: 1024

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: de-matrix-fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - TZ=UTC
      - F2B_LOG_LEVEL=INFO
    volumes:
      - proxy_logs:/var/log/nginx:ro
      - ./security/fail2ban/jail.local:/data/jail.local:ro
      - ./security/fail2ban/filter.d:/data/filter.d:ro
      - fail2ban_data:/data
    depends_on:
      proxy:
        condition: service_healthy

  logrotate:
    image: blacklabelops/logrotate:latest
    container_name: de-matrix-logrotate
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LOGS_DIRECTORIES=/var/log/nginx
      - LOGROTATE_INTERVAL=${DE_MATRIX_LOGROTATE_INTERVAL:-daily}
      - LOGROTATE_COPIES=${DE_MATRIX_LOGROTATE_COPIES:-14}
      - LOGROTATE_SIZE=25M
      - LOGROTATE_SU=true
    volumes:
      - proxy_logs:/var/log/nginx
    depends_on:
      proxy:
        condition: service_healthy

  admin:
    image: portainer/portainer-ce:latest
    container_name: de-matrix-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DE_MATRIX_ADMIN_UI_PORT:-19000}:9000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge

  smtp:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL

volumes:
  fail2ban_data:
  portainer_data:
