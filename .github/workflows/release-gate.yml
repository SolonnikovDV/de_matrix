name: de_matrix Release Gate

on:
  workflow_dispatch:
    inputs:
      run_prod_preflight:
        description: "Run hardened prod preflight checks"
        required: true
        type: boolean
        default: true
      run_full_smoke:
        description: "Run full smoke/e2e with rollback"
        required: true
        type: boolean
        default: true

concurrency:
  group: de-matrix-release-gate
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DE_MATRIX_PROXY_HTTP_PORT: "18080"
      DE_MATRIX_PROXY_HTTPS_PORT: "18443"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose config >/tmp/de_matrix_compose_base.yaml
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/tmp/de_matrix_compose_prod.yaml

      - name: Prepare hardening configs
        run: |
          chmod +x scripts/*.sh
          ./scripts/proxy_prepare_tls.sh
          ./scripts/fail2ban_prepare.sh

      - name: Full smoke/e2e
        if: ${{ inputs.run_full_smoke }}
        run: ./scripts/smoke_all.sh --rollback

      - name: Hardened prod preflight
        if: ${{ inputs.run_prod_preflight }}
        run: |
          DE_MATRIX_PROXY_HTTP_PORT=18080 DE_MATRIX_PROXY_HTTPS_PORT=18443 \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build proxy app postgres mongo fail2ban logrotate
          curl -fSs http://localhost:18080/proxy-health
          curl -fkSs https://localhost:18443/proxy-health

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail=200 || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v || true
          docker compose down -v || true

  manual-approval:
    name: Manual Approval (Production Environment)
    runs-on: ubuntu-latest
    needs: preflight
    environment:
      name: production
    steps:
      - name: Approval marker
        run: |
          echo "Release gate approved for production environment."

  release-ready:
    name: Release Ready
    runs-on: ubuntu-latest
    needs:
      - preflight
      - manual-approval
    steps:
      - name: Gate passed
        run: |
          echo "All release gate checks passed."
          echo "You can proceed with deployment."
